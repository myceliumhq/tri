packages:
  - "."

# @google/genai, protobufjs, tree-sitter-bash come from the `openclaw`
# peerDependency's own dependency tree (resolved locally for typechecking
# via autoInstallPeers, even though this package never imports openclaw at
# runtime -- see AGENTS.md). esbuild is pulled in via vitest. sqlite-vec
# ships a platform-specific native binary for @myceliumhq/index's vector
# store; onnxruntime-node/sharp are @huggingface/transformers' native deps
# for @myceliumhq/embed's optional local embedding provider.
allowBuilds:
  "@google/genai": true
  esbuild: true
  onnxruntime-node: true
  openclaw: true
  protobufjs: true
  sharp: true
  sqlite-vec: true
  tree-sitter-bash: true

# pnpm rejects a package published within the last 24h as a supply-chain
# guard against a just-published malicious version -- these are our own
# packages, published moments before this repo, so exempted explicitly.
# Safe to leave in place after they age past 24h (a no-op then, not an
# error); only needs updating if a *new* version is depended on within a
# day of its own publish.
minimumReleaseAgeExclude:
  - '@myceliumhq/dev-config@0.1.0'
  - '@myceliumhq/embed@0.1.0'
  - '@myceliumhq/index@0.1.0'
  - '@myceliumhq/mcp@0.1.0'
  - '@myceliumhq/toolkit@0.1.0'
